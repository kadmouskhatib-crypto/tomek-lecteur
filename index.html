<title>La rivière à l’envers</title>
<style>
:root{--bg:#f7f1e3;--paper:#fffaf0;--ink:#2b2420;--muted:#7a6d62;--line:#e4d8c3;--accent:#1d4e63;--accent2:#c8372d}
@media (prefers-color-scheme:dark){:root{--bg:#14181b;--paper:#1b2125;--ink:#e7e1d6;--muted:#9aa3a8;--line:#2c353a;--accent:#7cc3dd;--accent2:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)}
img{width:110px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
h1{font-family:Georgia,'Noto Serif',serif;font-size:25px;margin:14px 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.45}
input{width:100%;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:12px;font-size:19px;font-weight:700;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:15px;color:var(--muted)}
label input{width:22px;height:22px}
#err{color:var(--accent2);min-height:22px;margin-top:10px;font-size:15px}
</style></head><body>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC').trim()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(D.salt), iterations:D.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.iv)}, key, b64(D.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const err = document.getElementById('err');
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value; if(!pw) return;
  err.textContent = 'Ouverture… · Opening…';
  try{
    const html = await unlock(pw);
    try{ if(document.getElementById('rem').checked) localStorage.setItem('rae:pw', pw); }catch(x){}
    show(html);
  }catch(x){ err.textContent = '❌ Mot de passe incorrect · Wrong password'; }
};
(async () => { let pw = null; try{ pw = localStorage.getItem('rae:pw'); }catch(x){}
  if(pw){ try{ show(await unlock(pw)); }catch(x){ try{ localStorage.removeItem('rae:pw'); }catch(y){} } } })();
